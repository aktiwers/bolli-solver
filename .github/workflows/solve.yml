# Every 5 minutes: a quick check of YouTube's TV player script and yt-dlp's solver release (no packages installed);
# only when one changed, the solver runs and what it made is committed
name: Solve

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Prepare again even if nothing changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: solve

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORCE: ${{ inputs.force && '--force' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check
        id: check
        run: npm run solve -- --check $FORCE
      - name: Prepare
        id: prepare
        if: steps.check.outputs.todo == 'yes'
        env:
          FOUND: ${{ steps.check.outputs.found }}
          TAG: ${{ steps.check.outputs.tag }}
        run: npm ci --no-audit --no-fund && npm run solve -- $FORCE
      # Also after a failed preparation: state.json notes it, so the next runs wait for a change
      - name: Publish
        if: always() && steps.check.outputs.todo == 'yes'
        env:
          SUMMARY: ${{ steps.prepare.outputs.summary }}
        run: |
          git add -A players state.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "${SUMMARY:-Prepared}"
          git pull -q --rebase
          git push -q
